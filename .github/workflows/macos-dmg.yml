name: macOS DMG

on:
  push:
    branches: [development]
    tags: ['macos-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          modules: 'qtshadertools qtmultimedia qtspeech'
          cache: true
      - name: Build native Apple Silicon DMG
        id: build
        env:
          SIOYEK_ARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: ./build_mac.sh
      - name: Test app from the disk image
        run: |
          hdiutil attach build/sioyek-macos-arm64.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/sioyek-dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/sioyek-dmg"' EXIT
          ditto "$RUNNER_TEMP/sioyek-dmg/sioyek.app" "$RUNNER_TEMP/sioyek.app"
          python3 scripts/test_macos.py "$RUNNER_TEMP/sioyek.app"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-test
          path: build/smoke-test/
      - name: Upload DMG
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sioyek-macos-arm64
          path: |
            build/sioyek-macos-arm64.dmg
            build/sioyek-macos-arm64.dmg.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/macos-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sioyek-macos-arm64
          path: dist
      - name: Publish tested DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Native Apple Silicon build for macOS 13 or later. Download the DMG, open it, and drag Sioyek to Applications. No Rosetta or Homebrew required.

          The application is ad-hoc signed, not Apple-notarized. On first launch, macOS may require approval in System Settings → Privacy & Security → Open Anyway.

          Tested from the DMG on an Apple Silicon macOS runner: bundled library architectures and paths, code signature, PDF opening, navigation, zoom, search, OpenGL rendering, and shutdown. These checks do not guarantee the absence of all crashes.
          NOTES
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Sioyek for Apple Silicon — $RELEASE_TAG" --notes-file notes.md
